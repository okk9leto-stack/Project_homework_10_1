[tool.poetry]
name = "project-homework"
version = "0.1.0"
description = "My project"
authors = ["Oksana Kuznetsova <okk.9.leto@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
requests = ">=2.33.1"
python-dotenv = ">=1.2.2"
pytest = ">=9.0.3"
more-itertools = ">=11.0.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

